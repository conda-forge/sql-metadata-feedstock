{% set name = "sql-metadata" %}
{% set version = "2.19.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/sql_metadata-{{ version }}.tar.gz
  sha256: 901456eb877356da3e51cd61e3af7b99cb509f18bc4f516815fc442e609f4189

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - poetry-core >=1.0.0
    - python {{ python_min }}
  run:
    - python >={{ python_min }},<4.0
    - sqlparse >=0.4.1,<0.6.0

test:
  imports:
    - sql_metadata
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/macbre/sql-metadata
  summary: Uses tokenized query returned by python-sqlparse and generates query metadata
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - timkpaine
    - OstapStefakQC
